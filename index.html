<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Happy Birthday!</title>
  <style>
    body {
      background: linear-gradient(to right, #ffafbd, #ffc3a0);
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    h1 {
      font-size: 3em;
      margin: 0.5em 0;
      color: #fff;
      text-shadow: 2px 2px 4px #000;
    }
    .content {
      margin-top: 50px;
    }
    img {
      max-width: 80%;
      height: auto;
      border: 5px solid #fff;
      box-shadow: 0px 0px 15px rgba(0,0,0,0.3);
    }
    .notes-link {
      display: inline-block;
      margin-top: 30px;
      padding: 10px 20px;
      background: #fff;
      color: #333;
      text-decoration: none;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .notes-link:hover {
      background: #f0f0f0;
    }
  </style>
</head>
<body>
  <div class="content">
    <h1>HAPPY BIRTHDAY!</h1>
    <p style="color: #fff; font-size: 1.2em;">To the love of my life!</p>
    <!-- Replace "photo.jpg" with your actual photo file -->
    <img src="photo.jpg" alt="A lovely moment together">
    <br>
    <a class="notes-link" href="notes.html">Read My Notes</a>

</html>
