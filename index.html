<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday My Love!</title>
  <style>
    /* Overall page styles */
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at center, #ff9a9e, #fad0c4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
    }

    h1 {
      font-size: 3.5em;
      color: #fff;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
      margin-bottom: 20px;
    }

    p {
      color: #fff;
      font-size: 1.2em;
    }

    a {
      margin-top: 20px;
      padding: 10px 20px;
      text-decoration: none;
      background: #fff;
      color: #333;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    a:hover {
      background: #f0f0f0;
    }

    /* Heart container and pulsating heart */
    .heart-container {
      position: relative;
      width: 150px;
      height: 150px;
      margin-bottom: 20px;
    }
    .heart {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-45deg);
      -webkit-transform: translate(-50%, -50%) rotate(-45deg);
      width: 100px;
      height: 90px;
      background: #e25555;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
      animation: pulse 1.5s infinite;
      -webkit-animation: pulse 1.5s infinite;
    }
    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 100px;
      height: 90px;
      background: #e25555;
      border-radius: 50%;
    }
    .heart::before {
      top: -50px;
      left: 0;
    }
    .heart::after {
      left: 50px;
      top: 0;
    }
    @keyframes pulse {
      0% {
        transform: translate(-50%, -50%) scale(1) rotate(-45deg);
      }
      50% {
        transform: translate(-50%, -50%) scale(1.1) rotate(-45deg);
      }
      100% {
        transform: translate(-50%, -50%) scale(1) rotate(-45deg);
      }
    }
    @-webkit-keyframes pulse {
      0% {
        -webkit-transform: translate(-50%, -50%) scale(1) rotate(-45deg);
      }
      50% {
        -webkit-transform: translate(-50%, -50%) scale(1.1) rotate(-45deg);
      }
      100% {
        -webkit-transform: translate(-50%, -50%) scale(1) rotate(-45deg);
      }
    }

    /* Floating hearts animation */
    .floating-hearts {
      position: absolute;
      bottom: -50px;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
    }
    .floating-hearts span {
      position: absolute;
      display: block;
      background: #ff6f61;
      width: 20px;
      height: 20px;
      transform: rotate(45deg);
      -webkit-transform: rotate(45deg);
      opacity: 0.7;
      animation: float 5s infinite;
      -webkit-animation: float 5s infinite;
    }
    .floating-hearts span::before,
    .floating-hearts span::after {
      content: '';
      position: absolute;
      background: #ff6f61;
      width: 20px;
      height: 20px;
      border-radius: 50%;
    }
    .floating-hearts span::before {
      top: -10px;
      left: 0;
    }
    .floating-hearts span::after {
      left: 10px;
      top: 0;
    }
    @keyframes float {
      0% {
        transform: translateX(0) translateY(0) rotate(45deg);
        -webkit-transform: translateX(0) translateY(0) rotate(45deg);
        opacity: 0.7;
      }
      50% {
        opacity: 1;
      }
      100% {
        transform: translateX(50px) translateY(-800px) rotate(45deg);
        -webkit-transform: translateX(50px) translateY(-800px) rotate(45deg);
        opacity: 0;
      }
    }
    @-webkit-keyframes float {
      0% {
        -webkit-transform: translateX(0) translateY(0) rotate(45deg);
        opacity: 0.7;
      }
      50% {
        opacity: 1;
      }
      100% {
        -webkit-transform: translateX(50px) translateY(-800px) rotate(45deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <h1>HAPPY BIRTHDAY!</h1>
  <div class="heart-container">
    <div class="heart"></div>
  </div>
  <p>I love you more than words can say!</p>
  <a href="notes.html">Read My Notes</a>
  <!-- Floating hearts -->
  <div class="floating-hearts">
    <span style="left: 10%; animation-delay: 0s; -webkit-animation-delay: 0s;"></span>
    <span style="left: 30%; animation-delay: 1s; -webkit-animation-delay: 1s;"></span>
    <span style="left: 50%; animation-delay: 2s; -webkit-animation-delay: 2s;"></span>
    <span style="left: 70%; animation-delay: 3s; -webkit-animation-delay: 3s;"></span>
    <span style="left: 90%; animation-delay: 4s; -webkit-animation-delay: 4s;"></span>
  </div>
</body>
</html>
